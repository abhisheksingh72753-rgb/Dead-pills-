<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead Pills - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #090909;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
    background: #151515;
    padding: 35px 25px;
    border-radius: 20px;
    border: 1px solid #292929;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    color: #ff3155;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

h2 {
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #ff3155;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #ff3155;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: 0.8;
}

.forgot {
    display: block;
    color: #ff3155;
    text-decoration: none;
    margin: 20px 0;
}

.signup {
    color: #aaa;
    margin-top: 20px;
}

.signup a {
    color: #ff3155;
    text-decoration: none;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">DEAD PILLS</div>

    <p class="subtitle">Welcome to your world</p>

    <h2>Login Account</h2>

    <form onsubmit="loginDemo(event)">

        <input
        type="text"
        placeholder="Email or Mobile Number"
        required>

        <input
        type="password"
        placeholder="Password"
        required>

        <button type="submit">LOGIN</button>

    </form>

    <a href="#" class="forgot"
    onclick="alert('Password recovery will be added soon!')">
    Forgot Password?
    </a>

    <p class="signup">
    Don't have an account?
    <a href="#" onclick="alert('Sign Up coming soon!')">
    Create New Account
    </a>
    </p>

</div>

<script>
function loginDemo(event) {
    event.preventDefault();
    alert("Welcome to DEAD PILLS! Login system coming soon.");
}
</script>

</body>
</html>
